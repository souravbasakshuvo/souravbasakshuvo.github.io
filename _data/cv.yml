    Research Experience:
      - company: Bio-Neural Intelligence and Research Advancement Lab, KUET
        position: Researcher
        location: Khulna, Bangladesh
        start_date: 2025-06
        end_date: present
        highlights:
          - Designed NeuroSwin, a hybrid deep learning model (Swin Transformer-GRU), to classify Parkinson's Disease and identify its source regions in the brain from EEG signals.

      - company: Ulster University
        position: Research Assistant Intern
        location: Londonderry, UK
        start_date: 2024-10
        end_date: present
        highlights:
          - Developed TransfusionNet, a hybrid architecture with specialized preprocessing pipeline and early-layer feature fusion for cervical cancer detection. Published in Q1 journal Results in Engineering (Elsevier, IF 7.9).
          - Created a benchmark to evaluate LLM performance for disease classification, comparing against MobileCoAtNet for stomach infection classification.
          - Investigated foundational AI models for multi-cancer classification using MAML for domain adaptation.
          - Actively researching LLMs for disease diagnosis, reasoning, and treatment follow-up.

      - company: Department of Biomedical Engineering, KUET
        position: Undergraduate Research Assistant
        location: Khulna, Bangladesh
        start_date: 2023-02
        end_date: 2024-09
        highlights:
          - Designed a hybrid model for gallbladder cancer classification using parallel transfer learning, feature fusion, and LSTM, achieving 99.37% accuracy; published at ICEEICT 2024.
          - Gained experience in academic writing, literature review, and presenting research findings.

