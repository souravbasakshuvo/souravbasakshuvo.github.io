    Biomedical Engineering graduate from KUET, currently pursuing an MS in Biomedical Physics at the
    University of Dhaka. Researcher at BNIRA Lab (KUET) and Research Assistant at Ulster University,
    working on deep learning for medical image analysis, EEG-based neuroengineering, and large language
    models in healthcare. Three-time Dean's Award recipient, actively seeking PhD opportunities in
    neural and biomedical engineering.

