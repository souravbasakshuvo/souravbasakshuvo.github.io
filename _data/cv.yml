  summary: >
    Biomedical Engineering graduate from KUET with an M.Sc. in progress at University of Dhaka.
    Researcher specializing in deep learning, medical image processing, biomedical signal processing,
    generative AI, and large language models for healthcare. Research interests span disease detection,
    domain adaptation, health informatics, and neuroengineering.
    Three-time Dean's Award recipient. Actively seeking Ph.D. opportunities.

