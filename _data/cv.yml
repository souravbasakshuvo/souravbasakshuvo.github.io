          - "Thesis: Gallbladder Cancer Classification using Parallel Transfer Learning with Multi-model Feature Fusion and LSTM (99.37% accuracy)"

    Research Experience:
      - company: Bio-Neural Intelligence and Research Advancement Lab, KUET
        position: Researcher
        location: Khulna, Bangladesh
        start_date: 2025-06
        end_date: present
        highlights:
          - "Designed NeuroSwin, a hybrid deep learning model (Swin Transformer-GRU), to classify Parkinson's Disease and identify its source regions in the brain from EEG signals."

      - company: Ulster University
        position: Research Assistant Intern
        location: Londonderry, UK
        start_date: 2024-10
        end_date: present
        highlights:
          - "Developed TransfusionNet, a hybrid architecture augmented with a specialized preprocessing pipeline and an early-layer feature fusion paradigm for cervical cancer detection, published in Results in Engineering (Elsevier, Q1, IF: 7.9)."
          - "Created a benchmark to evaluate large language models (LLMs) in identifying disease classes, comparing results against proposed architecture MobileCoAtNet for stomach infection classification."
          - "Investigated foundational AI models for multi-cancer classification, implementing Model-Agnostic Meta-Learning (MAML) for domain adaptation."
          - "Actively researching the feasibility of LLMs for disease diagnosis, reasoning, and treatment follow-up in medical applications."

      - company: Department of Biomedical Engineering, KUET
        position: Undergraduate Research Assistant
        location: Khulna, Bangladesh
        start_date: 2023-02
        end_date: 2024-09
        highlights:
          - "Designed a hybrid model for gallbladder cancer classification using parallel transfer learning, feature fusion, and LSTM, achieving 99.37% accuracy; published at ICEEICT 2024."
          - "Gained experience in academic writing, literature review, and presenting research findings."

