    Projects:
      - name: IoT Based Pilot Health Monitoring System
        url: ""
        summary: >
          Developed an IoT-Based Pilot Health Monitoring System using ESP8266 NodeMCU, Arduino IDE,
          and sensors (MAX30100, DS18B20, BMP180), integrated with the Blynk IoT platform to monitor
          pilot health and aircraft state, enhancing flight safety.
        highlights:
          - Developed real-time health dashboard via Blynk IoT cloud platform

      - name: MediConnect – A Video Conferencing App for Telemedicine
        url: ""
        summary: >
          Developed a secure video conferencing app for telemedicine using Java, Firebase, and ZEGOCLOUD.
          Implemented features including medical image sharing, prescriptions, and real-time chat for
          comprehensive virtual medical consultations.
        highlights:
          - Implemented medical image sharing, digital prescriptions, and real-time chat

      - name: VitaSync – A Smart Band for Telemedicine Applications
        url: ""
        summary: >
          Remodeled a wearable device integrating sensors to track heart rate, body temperature,
          and blood oxygen levels. Developed real-time data transmission with a mobile app and alert
          mechanism notifying users of health irregularities via email.
        highlights:
          - Real-time data transmission with alert mechanism for abnormal readings

      - name: Telechroma – A Smart Colorimetric Analyzer
        url: ""
        summary: >
          Developed a portable colorimetric analyzer for telemedicine enabling remote diagnostics
          of glucose concentrations in urine samples. Integrated Arduino Nano and TCS3200 with a
          mobile app for real-time data transmission and analysis.
        highlights:
          - Designed for low-cost point-of-care diagnostics

      - name: Sanitary Napkin Vending Machine
        url: ""
        summary: >
          Designed and built an automated vending machine using RFID, Arduino Mega, stepper motors,
          and springs to promote menstrual hygiene through accessible and affordable technology.
        highlights:
          - RFID-authenticated dispensing with stepper motor control

    Training:
      - company: Dawn of Bioinformatics Limited
        position: "4-Day Training on Computer-Aided Drug Design: A to Z with Project"
        location: Dhaka, Bangladesh
        start_date: 2025-05
        end_date: 2025-05
        highlights:
          - "Prepared proteins and ligands (BIOVIA Discovery Studio, OpenBabel, Swiss-PdbViewer), executed docking in PyRx, interpreted binding poses and scores, and evaluated drug-likeness while assessing ADME/Toxicity."
          - "Ran molecular dynamics in YASARA and GROMACS (including protein–ligand simulations), processed trajectories and performed PCA to characterize conformational changes, analyzed results in Minitab, visualized structures in PyMOL, and applied the full CADD pipeline in a capstone mini-project."

      - company: Bangladesh University of Engineering and Technology
        position: "Full Day Technical Workshop on Biomaterials Based Wet Lab"
        location: Dhaka, Bangladesh
        start_date: 2022-08
        end_date: 2022-08
        highlights:
          - "Explored the work from the paper 'Preparation of Different Polymorphs of Cellulose from Different Acid Hydrolysis Medium' (International Journal of Biological Macromolecules, 2019) and gained hands-on experience in preparing cellulose nanocrystals (CNC) using acid hydrolysis under expert guidance."
          - "Learned to operate lab equipment such as magnetic stir plates, centrifuges, ovens, autoclaves, FTIR, X-ray diffractometers, and thermogravimetric analyzers used for analyzing the morphology and properties of CNCs."

